<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-labelledby="title desc">
<title id="title">GitHub OSS pulse</title>
<desc id="desc">Placeholder for automatically generated GitHub activity metrics.</desc>
<style>
:root { color-scheme: light dark; }
.bg{fill:#f6f8fa;stroke:#d0d7de}.t{fill:#24292f;font:600 15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.m{fill:#57606a;font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.box{fill:#fff;stroke:#d0d7de}
@media(prefers-color-scheme:dark){.bg{fill:#161b22;stroke:#30363d}.t{fill:#f0f6fc}.m{fill:#8b949e}.box{fill:#0d1117;stroke:#30363d}}
</style>
<rect class="bg" x="1" y="1" width="1198" height="208" rx="14"/>
<text class="t" x="32" y="45">OSS PULSE / LAST 12 MONTHS</text>
<text class="m" x="32" y="72">Run the included GitHub Action once to populate live contribution data.</text>
<rect class="box" x="32" y="98" width="1136" height="76" rx="10"/>
<text class="m" x="52" y="143">workflow_dispatch → profile-metrics.yml → scripts/generate_oss_pulse.py → assets/oss-pulse.svg</text>
