<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
<title id="title">Systems pipeline</title>
<desc id="desc">An animated diagram flowing from source graph through build graph, cache, compiler, scheduler, and artifacts.</desc>
<style>
  :root { color-scheme: light dark; }
  .bg { fill: #ffffff; }
  .panel { fill: #f6f8fa; stroke: #d0d7de; }
  .line { stroke: #8c959f; stroke-width: 2; fill: none; }
  .node { fill: #ffffff; stroke: #afb8c1; stroke-width: 1.5; }
  .node-hot { fill: #f6f8fa; stroke: #57606a; stroke-width: 1.8; }
  .txt { fill: #24292f; font: 600 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .muted { fill: #57606a; font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .label { fill: #57606a; font: 600 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 1px; }
  .packet { fill: #0969da; }
  .packet2 { fill: #1a7f37; }
  .packet3 { fill: #8250df; }
  .status { fill: #1a7f37; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; }
    .panel { fill: #161b22; stroke: #30363d; }
    .line { stroke: #484f58; }
    .node { fill: #0d1117; stroke: #484f58; }
    .node-hot { fill: #161b22; stroke: #8b949e; }
    .txt { fill: #f0f6fc; }
    .muted, .label { fill: #8b949e; }
    .packet { fill: #58a6ff; }
    .packet2 { fill: #3fb950; }
    .packet3 { fill: #a371f7; }
    .status { fill: #3fb950; }
  }
  @media (prefers-reduced-motion: reduce) {
    .moving { display: none; }
  }
</style>

<rect class="bg" x="0" y="0" width="1200" height="330" rx="16"/>
<rect class="panel" x="20" y="20" width="1160" height="290" rx="14"/>

<text class="label" x="52" y="58">SYSTEMS I LIKE TO OPTIMIZE</text>
<text class="muted" x="52" y="84">reduce work • move it once • cache the rest • measure everything</text>

<path id="flow" class="line" d="M124 178 H1076"/>
<path class="line" d="M440 178 C440 126 478 111 520 111 H612 C650 111 674 128 674 178" stroke-dasharray="4 5"/>

<g transform="translate(52 137)">
  <rect class="node" width="144" height="82" rx="12"/>
  <circle class="status" cx="20" cy="21" r="5"/>
  <text class="txt" x="18" y="49">source graph</text>
  <text class="muted" x="18" y="68">what changed?</text>
</g>

<g transform="translate(232 137)">
  <rect class="node" width="144" height="82" rx="12"/>
  <circle class="status" cx="20" cy="21" r="5"/>
  <text class="txt" x="18" y="49">build graph</text>
  <text class="muted" x="18" y="68">what depends?</text>
</g>

<g transform="translate(412 137)">
  <rect class="node-hot" width="144" height="82" rx="12"/>
  <circle class="status" cx="20" cy="21" r="5"/>
  <text class="txt" x="18" y="49">cache</text>
  <text class="muted" x="18" y="68">already done?</text>
</g>

<g transform="translate(592 137)">
  <rect class="node" width="144" height="82" rx="12"/>
  <circle class="status" cx="20" cy="21" r="5"/>
  <text class="txt" x="18" y="49">compiler</text>
  <text class="muted" x="18" y="68">do the work</text>
</g>

<g transform="translate(772 137)">
  <rect class="node" width="144" height="82" rx="12"/>
  <circle class="status" cx="20" cy="21" r="5"/>
  <text class="txt" x="18" y="49">scheduler</text>
  <text class="muted" x="18" y="68">where / when?</text>
</g>

<g transform="translate(952 137)">
  <rect class="node-hot" width="176" height="82" rx="12"/>
  <circle class="status" cx="20" cy="21" r="5"/>
  <text class="txt" x="18" y="49">artifacts + tests</text>
  <text class="muted" x="18" y="68">ship evidence</text>
</g>

<g class="moving">
  <circle class="packet" r="6">
    <animateMotion dur="6s" repeatCount="indefinite" path="M124 178 H1076"/>
  </circle>
  <circle class="packet2" r="5">
    <animateMotion dur="6s" begin="-2s" repeatCount="indefinite" path="M124 178 H1076"/>
  </circle>
  <circle class="packet3" r="4">
    <animateMotion dur="6s" begin="-4s" repeatCount="indefinite" path="M124 178 H1076"/>
  </circle>
</g>

<text class="muted" x="52" y="271">the goal: turn expensive developer workflows into infrastructure nobody has to think about</text>
</svg>
